<head>

  <title>Dance of Life</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"

  <!-- index.html -->
  <!DOCTYPE html>
  <html lang="ru">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance of Life</title>
    <meta name="description"
      content="Чувственная бачата с нуля — без стресса, с живой атмосферой. Москва, метро Лубянка, ул. Никольская, 25, ТЦ Наутилус">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display/600-italic.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/800.css">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <!-- ============ ШАПКА ============ -->
    <header id="header" class="header">
      <div class="container header-inner">
        <a href="#" class="logo" data-t="brand.logo"></a>
        <nav class="nav">
          <ul id="navList"></ul>
        </nav>
        <!-- Кнопка «Записаться» с иконкой Telegram → ведёт в Telegram -->
        <a href="#" data-tg class="btn btn-primary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" />
          </svg>
          <span data-t="navCta"></span>
        </a>
        <button id="burger" class="burger" aria-label="Меню" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
    <div id="mobileNav" class="mobile-nav"></div>

    <main>
      <!-- ============ HERO ============ -->
      <section id="hero" class="hero">
        <div class="container hero-inner">
          <div class="hero-text">
            <span class="sec-label" data-t="hero.label"></span>
            <h1 data-t="hero.title"></h1>
            <p data-t="hero.text"></p>
            <div class="hero-actions">
              <a href="#" data-tg class="btn btn-primary btn-lg">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" />
                </svg>
                <span data-t="hero.primaryBtn"></span>
              </a>
              <a href="#schedule" class="btn btn-ghost btn-lg" data-t="hero.secondaryBtn"></a>
            </div>
            <div class="hero-stats" id="heroStats"></div>
          </div>
          <div class="hero-photo reveal">
            <img src="img/hero.jpg" alt="Пара танцует бачату в неоновом свете">
          </div>
        </div>
      </section>

      <!-- ============ О ШКОЛЕ ============ -->
      <section id="about">
        <div class="container">
          <div class="sec-head">
            <span class="sec-label" data-t="about.label"></span>
            <h2 class="sec-title" data-t="about.title"></h2>
          </div>
          <p class="about-lead" data-t="about.lead"></p>
          <div class="cards" id="cards"></div>
        </div>
      </section>

      <!-- ============ РАСПИСАНИЕ ============ -->
      <section id="schedule">
        <div class="container">
          <div class="sec-head">
            <span class="sec-label" data-t="schedule.label"></span>
            <h2 class="sec-title" data-t="schedule.title"></h2>
          </div>
          <div class="sched" id="schedList"></div>
          <p class="sched-note" data-t="schedule.note"></p>
        </div>
      </section>

      <!-- ============ ГАЛЕРЕЯ ============ -->
      <section id="gallery">
        <div class="container">
          <div class="sec-head">
            <span class="sec-label" data-t="gallery.label"></span>
            <h2 class="sec-title" data-t="gallery.title"></h2>
          </div>
          <div class="gallery-photos">
            <div class="g-photo reveal"><img src="img/gallery-1.jpg" alt="Групповое занятие"></div>
            <div class="g-photo reveal"><img src="img/gallery-2.jpg" alt="Групповое занятие"></div>
            <div class="g-photo reveal"><img src="img/gallery-3.jpg" alt="Бачата-вечеринка"></div>
          </div>
          <!-- <div class="gallery-videos">
            <video class="g-video reveal" src="video/video-1.mp4" controls playsinline preload="metadata"></video>
            <video class="g-video reveal" src="video/video-2.mp4" controls playsinline preload="metadata"></video>
          </div> -->
        </div>
      </section>

      <!-- ============ ОТЗЫВЫ ============ -->
      <section id="reviews" class="reviews">
        <div class="container">
          <div class="sec-head">
            <span class="sec-label" data-t="reviews.label"></span>
            <h2 class="sec-title" data-t="reviews.title"></h2>
          </div>
          <div class="slider" id="slider">
            <div class="slider-track" id="sliderTrack"></div>
          </div>
          <div class="dots" id="dots"></div>
        </div>
      </section>

      <!-- ============ КОНТАКТЫ (без формы — всё в Telegram) ============ -->
      <section id="contact">
        <div class="container contact-grid">
          <div class="contact-left reveal">
            <span class="sec-label" data-t="contact.label"></span>
            <h2 data-t="contact.title"></h2>
            <p data-t="contact.text"></p>
            <!-- <a href="#" data-tg class="btn btn-telegram btn-lg tg-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" />
              </svg>
              <span data-t="contact.telegramBtn"></span>
            </a> -->
          </div>
          <div id="contactSocials" class="contact-socials"></div>

          <div class="contact-card reveal">
            <div class="c-item">
              <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                  <circle cx="12" cy="10" r="3" />
                </svg></div>
              <div><small data-t="contact.addressTitle"></small>
                <p data-t="contact.address"></p>
              </div>
            </div>
            <div class="c-item">
              <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.1L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg></div>
              <div><small data-t="contact.phoneTitle"></small>
                <p data-t="contact.phone"></p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ============ ФУТЕР ============ -->
    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p data-t="footer.copyright"></p>
          <p data-t="footer.subtitle"></p>
        </div>
      </div>
    </footer>

    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>

  </html>
</body>

</html>
