<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bachata Divine Studio</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/content.js" defer></script>
<script src="js/script.js" defer></script>
</head>
<body>

<!-- Общие SVG-ресурсы (свечения + силуэты для галереи) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2ea6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="radPink"><stop offset="0" stop-color="#ff2ea6" stop-opacity=".5"/><stop offset="1" stop-color="#ff2ea6" stop-opacity="0"/></radialGradient>
    <radialGradient id="radPurple"><stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="radWhite"><stop offset="0" stop-color="#e9d5ff" stop-opacity=".3"/><stop offset="1" stop-color="#e9d5ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="couple" viewBox="0 0 200 200">
      <g fill="#08050d">
        <circle cx="121" cy="47" r="9"/><circle cx="88" cy="52" r="8"/>
        <path d="M82,46 C74,50 70,58 68,66 C74,62 80,60 84,60 Z"/>
        <path d="M121,56 C114,66 112,78 113,92 C114,104 116,114 118,122 C112,140 106,158 100,176 L107,179 C114,162 120,146 124,132 C128,146 132,162 136,178 L143,176 C139,158 135,140 131,122 C133,110 134,96 132,82 C130,70 127,62 121,56 Z"/>
        <path d="M116,64 C106,70 98,76 92,82 L96,88 C104,82 112,76 119,72 Z"/>
        <path d="M88,60 C94,70 96,80 94,92 L86,94 C82,82 82,70 84,62 Z"/>
        <path d="M94,90 C82,112 72,132 64,150 C88,160 112,158 124,150 C116,130 106,110 98,92 Z"/>
        <path d="M84,150 C83,162 82,172 80,180 L86,181 C89,172 91,162 92,152 Z"/>
        <path d="M104,152 C106,162 109,172 112,180 L118,178 C114,169 111,160 109,151 Z"/>
        <path d="M90,66 C98,62 106,60 114,60 L115,66 C107,66 99,69 93,72 Z"/>
      </g>
    </symbol>
    <symbol id="solo" viewBox="0 0 200 200">
      <g fill="#08050d">
        <circle cx="100" cy="40" r="8"/>
        <path d="M92,34 C84,30 76,30 70,34 C78,36 86,38 92,40 Z"/>
        <path d="M96,50 C82,54 70,58 60,64 L63,70 C74,64 86,60 97,57 Z"/>
        <path d="M104,50 C118,54 130,58 140,64 L137,70 C126,64 114,60 103,57 Z"/>
        <path d="M100,48 C96,58 95,68 97,78 L103,78 C105,68 104,58 100,48 Z"/>
        <path d="M97,76 C80,96 66,112 56,126 C84,140 116,140 144,126 C134,112 120,96 103,76 Z"/>
        <path d="M92,132 C91,146 89,158 86,168 L92,170 C96,159 98,147 99,134 Z"/>
        <path d="M108,133 C110,146 113,158 117,168 L123,166 C118,156 115,145 113,132 Z"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- ============ ШАПКА ============ -->
<header class="header" id="header">
  <div class="container header-inner">
    <a class="logo" href="#top" data-t="brand.logo"></a>
    <nav class="nav" aria-label="Основная навигация"><ul id="navList"></ul></nav>
    <a href="#contact" class="btn btn-primary btn-sm" data-t="navCta"></a>
    <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<nav class="mobile-nav" id="mobileNav"></nav>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero">
    <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
    <div class="container hero-inner">
      <!-- Текст слева -->
      <div class="hero-text">
        <span class="sec-label" data-t="hero.label"></span>
        <h1 data-t="hero.title"></h1>
        <p data-t="hero.text"></p>
        <div class="hero-actions">
          <a href="#contact" class="btn btn-primary btn-lg" data-t="hero.primaryBtn"></a>
          <a href="#schedule" class="btn btn-ghost btn-lg" data-t="hero.secondaryBtn"></a>
        </div>
        <div class="hero-stats" id="heroStats"></div>
      </div>
      <!-- Горизонтальное фото справа -->
      <figure class="hero-photo reveal">
        <img src="img/hero.jpg" alt="Атмосфера Bachata Divine Studio" onerror="this.style.display='none'">
      </figure>
    </div>
  </section>

  <!-- ============ О ШКОЛЕ ============ -->
  <section id="about">
    <div class="container">
      <div class="sec-head reveal">
        <span class="sec-label" data-t="about.label"></span>
        <h2 class="sec-title" data-t="about.title"></h2>
      </div>
      <p class="about-lead reveal" data-t="about.lead"></p>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <!-- ============ РАСПИСАНИЕ ============ -->
  <section id="schedule">
    <div class="container">
      <div class="sec-head reveal">
        <span class="sec-label" data-t="schedule.label"></span>
        <h2 class="sec-title" data-t="schedule.title"></h2>
      </div>
      <div class="sched" id="schedList"></div>
      <p class="sched-note reveal" data-t="schedule.note"></p>
    </div>
  </section>

  <!-- ============ ГАЛЕРЕЯ ============ -->
  <section id="gallery">
    <div class="container">
      <div class="sec-head reveal">
        <span class="sec-label" data-t="gallery.label"></span>
        <h2 class="sec-title" data-t="gallery.title"></h2>
      </div>

      <!-- 👇 ТРИ ФОТО СВЕРХУ (файлы в папке img/) -->
      <div class="gallery-photos">
        <figure class="g-photo reveal"><img src="img/gallery-1.jpg" alt="Атмосфера студии" onerror="this.style.display='none'"></figure>
        <figure class="g-photo reveal"><img src="img/gallery-2.jpg" alt="Парный танец" onerror="this.style.display='none'"></figure>
        <figure class="g-photo reveal"><img src="img/gallery-3.jpg" alt="Бачата-вечеринка" onerror="this.style.display='none'"></figure>
      </div>

      <!-- 👇 ДВА ВИДЕО НИЖЕ (файлы в папке video/) -->
      <div class="gallery-videos">
        <video class="g-video reveal" src="video/video-1.mp4" controls playsinline preload="metadata"></video>
        <video class="g-video reveal" src="video/video-2.mp4" controls playsinline preload="metadata"></video>
      </div>
    </div>
  </section>

  <!-- ============ ОТЗЫВЫ ============ -->
  <section id="reviews" class="reviews">
    <div class="container">
      <div class="sec-head reveal">
        <span class="sec-label" data-t="reviews.label"></span>
        <h2 class="sec-title" data-t="reviews.title"></h2>
      </div>
      <div class="slider reveal" id="slider">
        <div class="slider-track" id="sliderTrack"></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </section>

  <!-- ============ КОНТАКТЫ ============ -->
  <section id="contact">
    <div class="container contact-grid">
      <div class="contact-left reveal">
        <span class="sec-label" data-t="contact.label"></span>
        <h2 data-t="contact.title"></h2>
        <p data-t="contact.text"></p>
        <div class="c-item">
          <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div><small data-t="contact.addressTitle"></small><p data-t="contact.address"></p></div>
        </div>
        <div class="c-item">
          <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
          <div><small data-t="contact.phoneTitle"></small><p data-t="contact.phone"></p></div>
        </div>
        <div class="c-item">
          <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></div>
          <div><small data-t="contact.emailTitle"></small><p data-t="contact.email"></p></div>
        </div>
        <div class="c-item">
          <div class="icon"><svg ...иконка письма...></svg></div>
          <div><small data-t="contact.emailTitle"></small><p data-t="contact.email"></p></div>
        </div>

        <!-- 👇 НОВАЯ КНОПКА -->
        <a href="#" id="tgBtn" class="btn btn-telegram btn-lg tg-btn" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          <span data-t="contact.telegramBtn"></span>
        </a>

        <p class="socials-title" data-t="contact.socialsTitle"></p>
        <div class="socials">
          <a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg></a>
          <a href="#" aria-label="Telegram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></a>
        </div>
      </div>

      <form class="form-card reveal" id="leadForm" novalidate>
        <span class="sec-label" data-t="contact.form.label"></span>
        <h3 data-t="contact.form.title"></h3>
        <div class="field">
          <label for="name"><span data-t="contact.form.nameLabel"></span> <em>*</em></label>
          <input type="text" id="name" name="name" data-t-placeholder="contact.form.namePlaceholder" required>
        </div>
        <div class="field">
          <label for="phone"><span data-t="contact.form.phoneLabel"></span> <em>*</em></label>
          <input type="tel" id="phone" name="phone" data-t-placeholder="contact.form.phonePlaceholder" required>
        </div>
        <div class="field">
          <label for="message" data-t="contact.form.messageLabel"></label>
          <textarea id="message" name="message" data-t-placeholder="contact.form.messagePlaceholder"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn" data-t="contact.form.submit"></button>
        <p class="form-note" data-t="contact.form.note"></p>
      </form>
    </div>
  </section>
</main>

<!-- ============ ФУТЕР ============ -->
<footer class="footer">
  <div class="footer-wave">
    <svg viewBox="0 0 1440 70" preserveAspectRatio="none" style="width:100%;height:100%">
      <path d="M0,40 C360,64 720,8 1080,26 C1260,35 1380,38 1440,30" fill="none" stroke="url(#gradPink)" stroke-width="2" opacity=".7"/>
    </svg>
  </div>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-about">
        <a class="logo" href="#top" data-t="brand.logo"></a>
        <p data-t="footer.about"></p>
        <div class="socials">
          <a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg></a>
          <a href="#" aria-label="Telegram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></a>
        </div>
      </div>
      <div>
        <h4 data-t="footer.navTitle"></h4>
        <ul class="footer-nav" id="footerNav"></ul>
      </div>
      <div>
        <h4 data-t="footer.contactsTitle"></h4>
        <ul class="footer-contacts" id="footerContacts"></ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p data-t="footer.copyright"></p>
      <p data-t="footer.subtitle"></p>
    </div>
  </div>
</footer>

</body>
</html>
